<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet Diary</title>
<script src="https://unpkg.com/pagecrypt/dist/pagecrypt.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
h1 { color: #7f9cf5; margin-bottom: 20px; }
#auth { max-width: 300px; margin: 100px auto; text-align: center; }
#auth input { width: 100%; padding: 10px; margin: 10px 0; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 5px; }
#auth button { padding: 10px 20px; background: #0f3460; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
#app { display: none; }
#editor { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
#editor textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid #0f3460; color: #e0e0e0; border-radius: 5px; padding: 10px; resize: vertical; }
#editor button { margin-top: 10px; padding: 8px 16px; background: #7f9cf5; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
.entry { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
.entry .date { font-size: 12px; color: #7f9cf5; margin-bottom: 8px; }
.entry .content { white-space: pre-wrap; line-height: 1.6; }
.entry button { margin-top: 8px; padding: 4px 10px; background: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
#logout { float: right; padding: 6px 12px; background: #333; color: #aaa; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="auth">
  <h2>Quiet Diary</h2>
  <input type="password" id="pwd" placeholder="Password">
  <button onclick="unlock()">Unlock</button>
</div>
<div id="app">
  <button id="logout" onclick="logout()">Logout</button>
  <h1>Quiet Diary</h1>
  <div id="editor">
    <textarea id="text" placeholder="Write something..."></textarea>
    <button onclick="save()">Save</button>
  </div>
  <div id="list"></div>
</div>
<script>
let PASSWORD = '';

async function unlock() {
  PASSWORD = document.getElementById('pwd').value;
  if (!PASSWORD) return;
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  load();
}

function logout() {
  PASSWORD = '';
  document.getElementById('auth').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pwd').value = '';
}

async function load() {
  const r = await fetch('/api/list');
  const items = await r.json();
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  for (const item of items) {
    let content = '';
    try {
      content = await PageCrypt.decrypt(PASSWORD, item.content);
    } catch (e) {
      content = item.content; // 旧日记明文直接显示;
    }
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="date">${new Date(+item.id).toLocaleString()}</div>
      <div class="content"></div>
      <button onclick="del('${item.id}')">Delete</button>
    `;
    div.querySelector('.content').textContent = content;
    listEl.appendChild(div);
  }
}

async function save() {
  const text = document.getElementById('text').value;
  if (!text) return;
  const encrypted = await PageCrypt.encrypt(PASSWORD, text);
  await fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: encrypted })
  });
  document.getElementById('text').value = '';
  load();
}

async function del(id) {
  await fetch('/api/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  load();
}
</script>
</body>
</html>
